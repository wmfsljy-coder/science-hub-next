# science-hub-next 는 보관용입니다. 예전 주소로 온 사람을 정식 주소로 넘겨주는 작은 페이지만 올립니다.
# 정식 허브: https://wmfsljy-coder.github.io/science-teacher-hub/ (소스·매일 새벽 빌드·점검은 science-teacher-hub 저장소의 site/ 와 pages.yml)
name: 넘겨주기 페이지 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 넘겨주기 페이지 만들기
        run: node scripts/make-archive.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
