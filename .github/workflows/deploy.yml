# main 에 올리면(또는 매일 새벽, 또는 손으로) 과목 저장소 내용을 새로 받아 빌드하고 GitHub Pages 에 올립니다.
name: 빌드와 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 매일 새벽 3시(한국 시간)에 단원 내용 새로 반영

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CONTENT_DIR: .content
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 과목 저장소 받기(얕은 복제)
        run: node scripts/fetch-content.mjs --clone

      - run: npm run lint

      - name: 정적 사이트 빌드
        run: npm run build

      # 배포 전 점검: out/ 을 공유 끈 로컬 서버로 띄우고 옛 점검 도구(allcheck·quizrun·labrun·tabcheck)를 새 경로로.
      # 푸시는 표본(과목마다 1단원 + 몇 개), 매일 새벽·손으로 돌릴 때는 44단원 전부. 실패하면 배포하지 않음.
      - name: 브라우저 설치(Playwright)
        run: npx playwright install --with-deps chromium

      - name: 배포 전 점검
        run: node scripts/check-units.mjs ${{ github.event_name != 'push' && '--all' || '' }}

      - name: 점검 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: check-report
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
